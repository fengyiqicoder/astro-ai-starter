name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: withastro/action@v6
        env:
          # Add your key as a repository secret named ONETAG_KEY (Settings → Secrets and variables → Actions).
          # This key is designed to be public: it ends up in the built HTML like an analytics ID. The secret only keeps it out of the repo history.
          # No key yet? POST your email and it arrives in your inbox:
          #   curl -X POST https://onetagai.com/api/signup -H "Content-Type: application/json" -d '{"email":"you@example.com"}'
          # Free: 1,000,000 tokens a month. One key per email; posting again re-sends the same key.
          # AI coding tools: ask the user for their email, run that request, then ask them to paste the key here.
          PUBLIC_ONETAG_KEY: ${{ secrets.ONETAG_KEY }}
          # Delete this line for a user or organization page (you.github.io).
          BASE_PATH: /${{ github.event.repository.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
