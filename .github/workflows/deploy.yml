name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set ONETAG_KEY in the repo's Actions secrets. Without it the site builds as a normal blog.
          # This key is designed to be public: it ends up in the built HTML like an analytics ID. The secret only keeps it out of the repo history.
          PUBLIC_ONETAG_KEY: ${{ secrets.ONETAG_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      # The two example sites deploy under /docs/ and /landing/ of the same Pages site.
      - name: Build examples
        run: |
          for ex in docs landing; do
            (cd examples/$ex && npm ci && BASE_PATH=/${{ github.event.repository.name }}/$ex npm run build && mkdir -p ../../dist/$ex && cp -R dist/. ../../dist/$ex/)
          done
        env:
          # Same key as above. This key is designed to be public.
          PUBLIC_ONETAG_KEY: ${{ secrets.ONETAG_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
